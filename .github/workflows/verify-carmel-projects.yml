name: Verify Carmel portfolio changes

on:
  push:
    branches:
      - feat/carmel-four-new-projects-2026-10-08

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
